<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>고양 약국지도</title>
<style>
:root{--bg:#f0eafb;--ink:#352b47;--muted:#766c86;--pink:#f8d4e2;--line:#e6ddf1;--purple:#8864ad}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,'Malgun Gothic',sans-serif}button,input{font:inherit}button,a,input{outline-offset:4px}button{cursor:pointer;border:0;border-radius:12px;background:var(--pink);color:#573346;padding:12px 16px;font-weight:700}button:hover{background:#f1bfd3}button:disabled{opacity:.55;cursor:wait}header{height:90px;padding:22px 32px;display:flex;align-items:center;gap:14px}.logo{display:grid;place-items:center;background:#fff;border-radius:15px;width:46px;height:46px;font-size:32px;color:var(--purple)}h1{font-size:23px;margin:0 0 5px;letter-spacing:-1px}.subtitle{font-size:12px;color:var(--muted);margin:0}.badge{margin-left:auto;border:1px solid #d8c9ea;border-radius:30px;padding:9px 15px;font-size:12px}main{display:grid;grid-template-columns:350px 1fr;gap:18px;height:calc(100dvh - 114px);min-height:480px;margin:0 24px 24px}aside{display:flex;flex-direction:column;background:#fcfaff;border:1px solid #fff;border-radius:22px;overflow:hidden;box-shadow:0 8px 35px #6549810a}.search-area{padding:25px 22px 15px;border-bottom:1px solid var(--line)}h2{font-size:19px;margin:0 0 8px}.hint{font-size:13px;line-height:1.7;color:var(--muted);margin:0 0 18px}label{font-size:12px;font-weight:bold;display:block;margin-bottom:8px}.search-row{display:flex;gap:7px}input{width:100%;min-width:0;padding:13px 12px;background:white;border:1px solid #d9cce6;border-radius:12px;color:var(--ink)}input:focus{outline:2px solid #b998d6}.search-row button{flex-shrink:0}.tools{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}.tools button{padding:8px 11px;font-size:12px}.status{font-size:12px;color:var(--muted);line-height:1.7;margin:14px 0 0}.result-heading{padding:17px 22px 10px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}#count{color:#704a97;font-weight:bold}#results{overflow:auto;flex:1;padding:0 12px 12px}.card{display:block;text-align:left;width:100%;background:white;border:1px solid var(--line);border-radius:14px;padding:16px;margin:8px 0;color:var(--ink);font-weight:normal}.card:hover,.card.selected{background:#f7edf6;border-color:#c899bc}.card strong{display:block;font-size:15px;margin-bottom:8px}.card span{display:block;color:var(--muted);font-size:12px;line-height:1.8}.card .phone{color:#866298;margin-top:5px}.empty{padding:36px 15px;text-align:center;font-size:13px;color:var(--muted);line-height:1.8}aside footer{padding:13px 22px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.7}.map-wrap{position:relative;border-radius:22px;overflow:hidden;background:#e4dcef;border:1px solid white}#map{height:100%;width:100%}.map-label{position:absolute;top:20px;left:20px;z-index:2;background:#fffffff2;padding:12px 16px;border-radius:12px;box-shadow:0 3px 18px #32214812;font-size:12px;pointer-events:none}#error{position:absolute;z-index:5;inset:0;display:grid;place-content:center;padding:32px;background:#f1eaf9;text-align:center}#error[hidden]{display:none}#error h2{font-size:20px}#error p{max-width:520px;font-size:14px;line-height:1.9;white-space:pre-line}#error a{color:#78509d}.bubble{padding:16px;min-width:220px;max-width:280px;font-size:13px;line-height:1.7}.bubble strong{display:block;margin-bottom:5px}.bubble a{color:#885080;display:inline-block;margin-top:8px}.bubble p{margin:0;color:#766c86;white-space:normal;word-break:keep-all}@media(max-width:760px){header{height:80px;padding:18px}.badge{display:none}main{margin:0 12px 12px;gap:12px;grid-template-columns:1fr;height:auto;min-height:0}aside{height:420px}.map-wrap{height:55dvh;min-height:340px}.search-area{padding:18px}.hint{margin-bottom:12px}h1{font-size:21px}.map-label{top:12px;left:12px}}
</style>
</head>
<body>
<header><div class="logo" aria-hidden="true">✚</div><div><h1>고양 약국지도</h1><p class="subtitle">우리 동네 약국을 조금 더 가깝게</p></div><span class="badge">경기도 고양시 · PHARMACY MAP</span></header>
<main>
<aside aria-label="약국 검색 및 결과">
<div class="search-area"><h2>어떤 약국을 찾으세요?</h2><p class="hint">약국 이름의 일부만 입력해 보세요.<br>고양시에 있는 약국을 찾아드려요.</p>
<form id="search"><label for="query">약국 이름 검색</label><div class="search-row"><input id="query" type="search" placeholder="예: 온누리, 건강, 우리" autocomplete="off"><button type="submit">검색</button></div></form>
<div class="tools"><button id="reset" type="button">전체 보기</button><button id="reload" type="button" disabled>다시 불러오기</button></div>
<p class="status" id="status" role="status" aria-live="polite">지도를 준비하고 있어요.</p></div>
<div class="result-heading"><span>검색 결과</span><span id="count">0곳</span></div><div id="results"><p class="empty">약국 정보를 불러오는 중입니다.</p></div>
<footer>카카오맵 제공 정보 기준 · 등록 누락이 있을 수 있어요.<br>운영 시간과 영업 여부는 방문 전 전화로 확인해 주세요.</footer>
</aside>
<section class="map-wrap" aria-label="고양시 약국 지도"><div id="map"></div><div class="map-label">✚ 약국을 누르면 상세 정보를 볼 수 있어요</div><div id="error" hidden><h2>지도를 불러오지 못했어요</h2><p id="error-text"></p><a href="https://apis.map.kakao.com/web/guide/" target="_blank" rel="noopener noreferrer">카카오맵 설정 안내 보기 ↗</a></div></section>
</main>
<script>
'use strict';
// 실행: 이 파일의 폴더에서 python -m http.server 8080
// 카카오 개발자 사이트에서 JavaScript SDK 도메인에 http://localhost:8080 등록.
// 브라우저: http://localhost:8080/goyang-pharmacy.html
const APP_KEY='8d6ef96ff9af00addd82d677a395ed91';
const $=id=>document.getElementById(id);
let map,places,cluster,info,loading=false,partial=false,requests=0;
const records=new Map();let visible=[],markers=new Map();
const normalize=s=>s.normalize('NFKC').toLocaleLowerCase('ko-KR').replace(/\s+/g,'');
function isGoyang(p){return /^(경기|경기도) 고양시(?:\s|$)/.test(p.address_name||p.road_address_name||'');}
function failure(message){$('error').hidden=false;$('error-text').textContent=message;$('status').textContent='지도 연결 설정을 확인해 주세요.';}
function fit(){if(!map)return;if(!visible.length){map.setCenter(new kakao.maps.LatLng(37.6584,126.832));map.setLevel(8);return;}const b=new kakao.maps.LatLngBounds();visible.forEach(p=>b.extend(new kakao.maps.LatLng(+p.y,+p.x)));if(visible.length===1){map.setCenter(b.getSouthWest());map.setLevel(3);}else map.setBounds(b);}
function select(p){info.close();map.setLevel(3);map.panTo(new kakao.maps.LatLng(+p.y,+p.x));const box=document.createElement('div');box.className='bubble';const name=document.createElement('strong');name.textContent=p.place_name;box.append(name);for(const t of [p.road_address_name||p.address_name,p.phone||'전화번호 정보 없음']){const line=document.createElement('p');line.textContent=t;box.append(line);}const link=document.createElement('a');link.href='https://map.kakao.com/link/map/'+encodeURIComponent(p.id);link.target='_blank';link.rel='noopener noreferrer';link.textContent='카카오맵에서 자세히 보기 ↗';box.append(link);info.setContent(box);info.open(map,markers.get(p.id));document.querySelectorAll('.card').forEach(el=>el.classList.toggle('selected',el.dataset.id===p.id));const card=document.getElementById('place-'+p.id);if(card)card.scrollIntoView({block:'nearest',behavior:'smooth'});}
function render(shouldFit=false){const q=normalize($('query').value.trim());visible=[...records.values()].filter(p=>normalize(p.place_name).includes(q)).sort((a,b)=>a.place_name.localeCompare(b.place_name,'ko'));$('count').textContent=visible.length+'곳';$('results').replaceChildren();if(cluster)cluster.clear();if(info)info.close();markers.clear();const fragment=document.createDocumentFragment();const pins=[];for(const p of visible){const card=document.createElement('button');card.type='button';card.className='card';card.id='place-'+p.id;card.dataset.id=p.id;const title=document.createElement('strong');title.textContent=p.place_name;const address=document.createElement('span');address.textContent=p.road_address_name||p.address_name;const phone=document.createElement('span');phone.className='phone';phone.textContent=p.phone||'전화번호 정보 없음';card.append(title,address,phone);card.onclick=()=>select(p);fragment.append(card);if(map){const pin=new kakao.maps.Marker({position:new kakao.maps.LatLng(+p.y,+p.x),title:p.place_name});kakao.maps.event.addListener(pin,'click',()=>select(p));markers.set(p.id,pin);pins.push(pin);}}$('results').append(fragment);if(cluster)cluster.addMarkers(pins);if(!visible.length){const empty=document.createElement('p');empty.className='empty';empty.textContent=loading?'약국을 찾고 있어요. 잠시만 기다려 주세요.':partial?'조회된 정보에 일치하는 약국이 없어요. 다시 불러오기를 눌러 보세요.':'검색 결과가 없어요. 다른 약국 이름을 입력해 보세요.';$('results').append(empty);}if(shouldFit)fit();}
// 큰 지역의 검색 결과 제한을 피하도록 밀집 구역을 재분할하고 ID로 중복 제거.
function queryCell(cell,page=1){return new Promise((resolve,reject)=>{if(++requests>260){reject(new Error('limit'));return;}const timer=setTimeout(()=>reject(new Error('timeout')),12000);places.categorySearch('PM9',(data,status,pagination)=>{clearTimeout(timer);if(status===kakao.maps.services.Status.ZERO_RESULT)resolve({data:[],total:0,next:false});else if(status===kakao.maps.services.Status.OK)resolve({data,total:pagination.totalCount,next:pagination.hasNextPage});else reject(new Error('api'));},{bounds:new kakao.maps.LatLngBounds(new kakao.maps.LatLng(cell[1],cell[0]),new kakao.maps.LatLng(cell[3],cell[2])),size:15,page});});}
function add(data){data.filter(isGoyang).forEach(p=>records.set(p.id,p));}
async function scan(cell,depth=0){const first=await queryCell(cell);add(first.data);if(first.total>=45&&depth<7){const [w,s,e,n]=cell,x=(w+e)/2,y=(s+n)/2;for(const child of [[w,s,x,y],[x,s,e,y],[w,y,x,n],[x,y,e,n]])await scan(child,depth+1);}else{let result=first;for(let page=2;result.next&&page<=3;page++){result=await queryCell(cell,page);add(result.data);}if(first.total>=45)partial=true;} $('status').textContent='고양시 약국을 불러오는 중 · '+records.size+'곳';render();}
async function load(){if(loading||!map)return;loading=true;partial=false;requests=0;records.clear();$('reload').disabled=true;render();try{await scan([126.67,37.55,127.02,37.80]);}catch(error){partial=true;}finally{loading=false;$('reload').disabled=false;$('status').textContent=partial?'일부 지역을 조회하지 못했어요. 다시 불러오기를 눌러 주세요.':records.size+'곳의 약국을 불러왔어요. 이름을 입력하면 바로 검색돼요.';render(true);}}
$('search').onsubmit=e=>{e.preventDefault();render(true);};let debounce;$('query').addEventListener('input',()=>{clearTimeout(debounce);debounce=setTimeout(()=>render(true),180);});$('reset').onclick=()=>{$('query').value='';render(true);$('query').focus();};$('reload').onclick=load;
function start(){try{map=new kakao.maps.Map($('map'),{center:new kakao.maps.LatLng(37.6584,126.832),level:8});places=new kakao.maps.services.Places();info=new kakao.maps.InfoWindow({removable:true});cluster=new kakao.maps.MarkerClusterer({map,averageCenter:true,minLevel:6,styles:[{width:'42px',height:'42px',background:'#ecdaf6',border:'2px solid #fff',borderRadius:'50%',color:'#573c76',textAlign:'center',lineHeight:'38px',fontWeight:'bold'}]});map.addControl(new kakao.maps.ZoomControl(),kakao.maps.ControlPosition.RIGHT);new ResizeObserver(()=>{const center=map.getCenter();map.relayout();map.setCenter(center);}).observe($('map'));$('error').hidden=true;load();}catch(error){failure('지도 초기화에 실패했어요. JavaScript 키와 카카오맵 사용 설정을 확인해 주세요.');}}
if(location.protocol==='file:'){failure('HTML 파일을 직접 열면 카카오맵 인증이 실패할 수 있어요.\n1. 카카오 개발자 사이트에 http://localhost:8080 을 JavaScript SDK 도메인으로 등록하세요.\n2. 이 파일의 폴더에서 python -m http.server 8080 을 실행하세요.\n3. http://localhost:8080/goyang-pharmacy.html 에 접속하세요.');}else{const script=document.createElement('script');script.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+APP_KEY+'&autoload=false&libraries=services,clusterer';const timeout=setTimeout(()=>failure('연결이 지연되고 있어요. 인터넷 연결 및 등록된 JavaScript SDK 도메인을 확인한 뒤 새로고침해 주세요.'),15000);script.onerror=()=>{clearTimeout(timeout);failure('카카오맵 SDK를 불러올 수 없어요. 인터넷 연결, JavaScript 키, 등록된 SDK 도메인과 카카오맵 사용 설정을 확인해 주세요.');};script.onload=()=>{if(!window.kakao?.maps){clearTimeout(timeout);failure('카카오맵 인증을 확인해 주세요. 현재 접속 주소: '+location.origin);return;}kakao.maps.load(()=>{clearTimeout(timeout);start();});};document.head.append(script);}
</script>
</body>
</html>
