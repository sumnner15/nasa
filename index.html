<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NASA 소행성 및 우주 사진 조회</title>
  <style>
    :root {
      --bg-color: #0b0d17;
      --card-bg: #15192b;
      --accent-color: #4f46e5;
      --text-color: #e2e8f0;
      --hazard-color: #ef4444;
      --safe-color: #10b981;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 20px;
      color: #ffffff;
      text-align: center;
    }

    .search-box {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 30px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    }

    input[type="date"] {
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #374151;
      background: #1f2937;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    button {
      padding: 10px 20px;
      border-radius: 6px;
      border: none;
      background-color: var(--accent-color);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #4338ca;
    }

    .apod-banner {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 30px;
      border: 1px solid #1e293b;
    }

    .apod-banner img {
      width: 100%;
      max-height: 350px;
      object-fit: cover;
      display: block;
    }

    .apod-info {
      padding: 15px 20px;
    }

    .apod-info h2 {
      margin: 0 0 8px 0;
      font-size: 1.2rem;
      color: #38bdf8;
    }

    .apod-info p {
      margin: 0;
      font-size: 0.9rem;
      color: #94a3b8;
      line-height: 1.4;
    }

    .loading {
      display: none;
      margin: 20px 0;
      font-size: 1.1rem;
      color: #9ca3af;
    }

    .results {
      width: 100%;
      max-width: 800px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 10px;
      border: 1px solid #1e293b;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background-color: #000;
    }

    .card-body {
      padding: 15px;
      flex-grow: 1;
    }

    .card.hazard {
      border-left: 5px solid var(--hazard-color);
    }

    .card.safe {
      border-left: 5px solid var(--safe-color);
    }

    .card h3 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 1.1rem;
      color: #fff;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .badge.hazard {
      background: rgba(239, 68, 68, 0.2);
      color: var(--hazard-color);
    }

    .badge.safe {
      background: rgba(16, 185, 129, 0.2);
      color: var(--safe-color);
    }

    .info-item {
      font-size: 0.85rem;
      margin: 5px 0;
      color: #94a3b8;
    }

    .info-item strong {
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <h1>🌌 NASA 날짜별 소행성 & 우주 사진</h1>

  <div class="search-box">
    <label for="search-date">날짜 선택:</label>
    <input type="date" id="search-date">
    <button onclick="fetchAllData()">조회하기</button>
  </div>

  <div class="loading" id="loading">데이터와 이미지를 불러오는 중입니다...</div>

  <!-- 선택한 날짜의 APOD (오늘의 천문 사진) 배너 -->
  <div class="apod-banner" id="apod-banner" style="display:none;">
    <img id="apod-img" src="" alt="APOD Image">
    <div class="apod-info">
      <h2 id="apod-title"></h2>
      <p id="apod-explanation"></p>
    </div>
  </div>

  <!-- 소행성 목록 -->
  <div class="results" id="results"></div>

  <script>
    const API_KEY = 'vnsn2CChah4jrDGxGhhHtGFnX1nbED1iMu7QZDDr';
    
    // 기본 날짜를 오늘로 지정
    const dateInput = document.getElementById('search-date');
    dateInput.value = new Date().toISOString().split('T')[0];

    async function fetchAllData() {
      const selectedDate = dateInput.value;
      if (!selectedDate) {
        alert('날짜를 선택해 주세요.');
        return;
      }

      const loading = document.getElementById('loading');
      const resultsContainer = document.getElementById('results');
      const apodBanner = document.getElementById('apod-banner');

      loading.style.display = 'block';
      resultsContainer.innerHTML = '';
      apodBanner.style.display = 'none';

      try {
        // 1. APOD (오늘의 천문 사진) 가져오기
        fetchApod(selectedDate);

        // 2. 소행성 목록 가져오기
        const neoUrl = `https://api.nasa.gov/neo/rest/v1/feed?start_date=${selectedDate}&end_date=${selectedDate}&api_key=${API_KEY}`;
        const response = await fetch(neoUrl);
        if (!response.ok) throw new Error(`오류 발생: ${response.status}`);

        const data = await response.json();
        const asteroids = data.near_earth_objects[selectedDate] || [];

        loading.style.display = 'none';

        if (asteroids.length === 0) {
          resultsContainer.innerHTML = '<p>해당 날짜에 접근하는 소행성 데이터가 없습니다.</p>';
          return;
        }

        // 소행성 카드 생성 (비동기로 각 소행성 관련 이미지 로드)
        for (const asteroid of asteroids) {
          const isHazard = asteroid.is_potentially_hazardous_asteroid;
          const minDiameter = Math.round(asteroid.estimated_diameter.meters.estimated_diameter_min);
          const maxDiameter = Math.round(asteroid.estimated_diameter.meters.estimated_diameter_max);
          const closeApproach = asteroid.close_approach_data[0];
          const missDistance = Math.round(closeApproach.miss_distance.kilometers).toLocaleString();
          const speed = Math.round(closeApproach.relative_velocity.kilometers_per_hour).toLocaleString();

          // NASA 이미지 라이브러리에서 소행성 관련 이미지 검색
          const imageUrl = await fetchAsteroidImage(asteroid.name);

          const card = document.createElement('div');
          card.className = `card ${isHazard ? 'hazard' : 'safe'}`;
          card.innerHTML = `
            <img class="card-img" src="${imageUrl}" alt="${asteroid.name}" onerror="this.src='https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?w=500&auto=format&fit=crop'">
            <div class="card-body">
              <h3>${asteroid.name}</h3>
              <span class="badge ${isHazard ? 'hazard' : 'safe'}">
                ${isHazard ? '⚠️ 잠재적 위험' : '✅ 안전'}
              </span>
              <div class="info-item"><strong>추정 지름:</strong> ${minDiameter}m ~ ${maxDiameter}m</div>
              <div class="info-item"><strong>최대 접근 거리:</strong> ${missDistance} km</div>
              <div class="info-item"><strong>상대 속도:</strong> 시속 ${speed} km/h</div>
            </div>
          `;
          resultsContainer.appendChild(card);
        }

      } catch (error) {
        loading.style.display = 'none';
        resultsContainer.innerHTML = `<p style="color: var(--hazard-color);">데이터를 가져오지 못했습니다: ${error.message}</p>`;
      }
    }

    // 선택한 날짜의 APOD 이미지 가져오기
    async function fetchApod(date) {
      try {
        const url = `https://api.nasa.gov/planetary/apod?date=${date}&api_key=${API_KEY}`;
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          if (data.media_type === 'image') {
            document.getElementById('apod-img').src = data.url;
            document.getElementById('apod-title').innerText = `📸 ${date} NASA 오늘의 우주 사진: ${data.title}`;
            document.getElementById('apod-explanation').innerText = data.explanation.substring(0, 150) + '...';
            document.getElementById('apod-banner').style.display = 'block';
          }
        }
      } catch (e) {
        console.log('APOD 불러오기 실패:', e);
      }
    }

    // NASA Image Library에서 소행성 이름 또는 기본 소행성 이미지 가져오기
    async function fetchAsteroidImage(name) {
      // 소행성 고유 번호/이름 정제 (예: "(2023 DW)" -> "asteroid")
      const searchKeyword = "asteroid"; 
      const url = `https://images-api.nasa.gov/search?q=${searchKeyword}&media_type=image`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        const items = data.collection.items;
        if (items && items.length > 0) {
          // 랜덤하게 소행성 관련 이미지 하나 선택
          const randomIndex = Math.floor(Math.random() * Math.min(items.length, 10));
          return items[randomIndex].links[0].href;
        }
      } catch (e) {
        console.log('이미지 라이브러리 검색 실패', e);
      }
      // 실패 시 고화질 우주/소행성 대체 이미지 반환
      return 'https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?w=500&auto=format&fit=crop';
    }

    // 첫 진입 시 자동 실행
    fetchAllData();
  </script>
</body>
</html>
